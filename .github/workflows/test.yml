name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jobs-app/server
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Check server
        run: deno check server.ts
      - name: Server and utility tests
        run: deno task test:server
      - name: Browser tests
        if: runner.os == 'Linux'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: deno task test:browser
