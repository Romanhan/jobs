name: Build Windows Executable
on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml
  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      
      - name: Build executable
        working-directory: jobs-app/server
        run: deno task build

      - name: Test compiled executable and embedded UI
        working-directory: jobs-app/server
        shell: pwsh
        run: |
          $env:JOBS_TEST_EXECUTABLE = (Resolve-Path jobs-app.exe).Path
          $env:CHROME_BIN = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          deno task test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-app
          path: jobs-app/server/jobs-app.exe
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jobs-app/server/jobs-app.exe
          generate_release_notes: true
