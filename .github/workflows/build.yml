name: Build Windows Executable
on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml
  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          # Pinned on purpose: Deno 2.9.7 `deno compile` output is flagged by
          # WithSecure as Trojan.TR/W64.Malware (false positive). 2.9.8 was
          # scanned clean for both a hello-world and a real app build.
          deno-version: v2.9.8
      
      - name: Build executable
        working-directory: jobs-app/server
        run: deno task build

      - name: Verify embedded file version
        working-directory: jobs-app/server
        shell: pwsh
        run: |
          $expected = (Get-Content deno.json | ConvertFrom-Json).version
          $actual = (Get-Item jobs-app.exe).VersionInfo.FileVersion
          Write-Host "expected=$expected actual=$actual"
          if ($actual -notlike "$expected*") {
            Write-Error "jobs-app.exe reports version '$actual', expected '$expected'"
            exit 1
          }

      - name: Test compiled executable and embedded UI
        working-directory: jobs-app/server
        shell: pwsh
        run: |
          $env:JOBS_TEST_EXECUTABLE = (Resolve-Path jobs-app.exe).Path
          $env:CHROME_BIN = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          deno task test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-app
          path: jobs-app/server/jobs-app.exe
      
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jobs-app/server/jobs-app.exe
          generate_release_notes: true
